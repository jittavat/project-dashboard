[package]
name = "project-dashboard-backend"
version = "0.1.0"
edition = "2021"
default-run = "project-dashboard-backend"

[dependencies]
# Web framework
actix-web  = "4"
actix-cors = "0.7"

# Database
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "chrono", "migrate"] }

# Auth
jsonwebtoken = "9"
argon2       = "0.5"

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Config / env
dotenvy = "0.15"

# Error handling
thiserror = "1"
anyhow    = "1"

# Identifiers & time
uuid   = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Logging
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-actix-web  = "0.7"

# OpenAPI
utoipa            = { version = "4", features = ["actix_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "7", features = ["actix-web"] }

[dev-dependencies]
actix-web = { version = "4", features = ["macros"] }
tokio     = { version = "1", features = ["full"] }

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
